name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'lib/i18n/**'
  pull_request:
    paths:
      - 'rust/**'
      - 'lib/i18n/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # The Rust catalogs are committed copies of lib/i18n/*.sh; a missing key
      # would not crash (t() falls back to the key itself), so the key sets
      # are compared here and any divergence fails the job.
      - name: i18n parity gate (bash vs rust catalogs)
        run: scripts/i18n-parity.sh
